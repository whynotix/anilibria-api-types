name: Auto style with Ruff and create PR

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Название ветки для авто-стиля"
        required: false
        default: "auto-style/ruff-fixes"

concurrency:
  group: auto-style-ruff
  cancel-in-progress: false

jobs:
  auto-style-and-pr:
    name: "Apply Ruff style & create PR"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Poetry and dependencies
        uses: ./.github/actions/setup-poetry

      - name: Apply Ruff fixes
        id: ruff
        run: |
          poetry run ruff check --fix --unsafe-fixes --exit-zero .
          poetry run ruff format . || true
          poetry run ruff check --statistics --exit-zero .

          # Проверяем, есть ли изменения
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.ruff.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event.inputs.branch_name || 'auto-style/ruff-fixes' }}
          base: dev
          title: "style: apply ruff auto-fixes"
          body: |
            ## Apply auto ruff-style

            This PR is created automatically by the apply-ruff-style workflow.

            ### Changes:
            - `ruff check --fix`
            - `ruff format`
          labels: |
            automated-pr
            style
          commit-message: "style: apply ruff auto-fixes and formatting"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          delete-branch: true

      - name: Report no changes
        if: steps.ruff.outputs.changes == 'false'
        run: |
          echo "No changes to apply"
