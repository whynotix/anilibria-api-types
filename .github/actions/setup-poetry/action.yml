name: Setup Poetry and dependencies
description: Setup Python, Poetry and install dependencies with caching

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.13"

  install-extras:
    description: Install extra dependencies (set to 'true' for --all-extras, or pass specific flags)
    required: false
    default: "true"

  install-dev:
    description: Install dev dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Setup Python with Poetry Caching
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "poetry"

    - name: Install dependencies
      shell: bash
      run: |
        ARGS=""

        if [ "${{ inputs.install-extras }}" = "true" ]; then
          ARGS="$ARGS --all-extras"
        elif [ -n "${{ inputs.install-extras }}" ] && [ "${{ inputs.install-extras }}" != "false" ]; then
          ARGS="$ARGS ${{ inputs.install-extras }}"
        fi

        if [ "${{ inputs.install-dev }}" = "true" ]; then
          ARGS="$ARGS --with dev"
        else
          ARGS="$ARGS --without dev"
        fi

        poetry lock --check || poetry lock --no-update
        poetry install $ARGS
