[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anilibria-api-types"
version = "1.0.0rc1"
description = ""
authors = [
    {name = "whynotix",email = "semenbolotov414@gmail.com"}
]
license = {text = "The Unlicense"}
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "aiohttp (>=3.14.3,<4.0.0)",
    "aiofiles (>=24.1.0,<26.0.0)",
    "jsonref (>=1.1.0,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "anilibria-api-client (>=1.0.0rc1)"
]

[project.urls]
Homepage = "https://github.com/whynotix/anilibria-api-types"
Issues = "https://github.com/whynotix/anilibria-api-types/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["anilibria_api_types*"]
exclude = ["dist*", "build*", "anilibria_api_types/codegen*"] 

[tool.ruff]
target-version = "py313"
line-length = 79
extend-exclude = [
    "database"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # Conflicts with the formatter
    "ISC001",   # Conflicts with the formatter
    "PT001",    # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",    # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715

    # Thoughtful ignores
    "N818",     # Exception name should be named with an Error suffix
    "D",        # Missing docstring
    "TRY401",   # Redundant exception object included in `logging.exception` call
    "EM101",    # Checks for the use of string literals in exception constructors
    "ANN401",   # Dissallows `Any` in typing
    "BLE001",   # Dissallows `except Exception`
    "PLR0913",  # Too many arguments in function definition
    "PERF401",  # Use a list comprehension to create a transformed list
    "S324",     # Dissallows hashlib.md5 usage
    "ARG001",   # Unused function argument
    "ARG002",   # Unused method argument
    "TRY003",   # Avoid specifying long messages outside the exception class
    "ARG005",   # Unused lambda argument
    "PTH",      # Force using pathlib
    "FBT003",   # Boolean value as argument
    "SIM117",   # Use a single `with` statement with multiple contexts
    "B008",     # Do not perform function call in argument defaults

    # Temp ignores, need to handle this
    "ANN201",
    "TD",
    "FIX",
    "G004",
    "INP001",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
    "E402", # Module level import not at top of file
]
"**/env.py" = [
    "ERA001", # Found commented-out code
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-line-length = 72

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.mypy]
disallow_untyped_defs = true # Functions need to be annotated
warn_unused_ignores = true